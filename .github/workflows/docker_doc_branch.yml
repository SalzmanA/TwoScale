name: Build TwoScale branch image for validation and doc

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - docs/requirements.txt
      - docker/Dockerfile.doc
      - cpp/**
      - python/**

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      # Authenticate to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate Docker image tags and labels
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ vars.REPO_NAME_IO }}/twoscale
          tags: |
            type=ref,event=branch

      # Build and push Docker image
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.doc
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

      - name: Get Docker tag
        id: image
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Trigger documentation
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'doc.yml',
              ref: 'main',
              inputs: {
                image_tag: '${{ steps.image.outputs.tag }}',
                source_ref: '${{ github.ref_name }}',
                source_sha: '${{ github.sha }}',
                deploy: 'false'
              }
            })

