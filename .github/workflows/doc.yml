name: Documentation

run-name: "Documentation - ${{ inputs.source_sha || github.sha }}"

on:
  # Called explicitly by Docker workflows
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to use
        required: true
        type: string

      source_ref:
        description: Git ref containing the documentation source
        required: true
        type: string

      source_sha:
        description: Git commit containing the documentation source
        required: true
        type: string

      deploy:
        description: Deploy to GitHub Pages
        required: true
        type: boolean
        default: false

  # Documentation-only changes
  push:
    paths:
      - "docs/**"
      - "!docs/requirements.txt"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  book:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    container:
      image: ghcr.io/${{ vars.REPO_NAME_IO }}/twoscale:${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'latest' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - name: Generate Doc
        working-directory: docs
        run: make

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: book

    # Deploy only:
    # - docs changes on main
    # - Docker main image explicitly requested deployment
    # Never deploy branch documentation.
    if: >
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.deploy == true
      )

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

